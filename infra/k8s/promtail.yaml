apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: shop-agent
  labels:
    app: promtail
data:
  promtail.yaml: |
    positions:
      filename: /tmp/positions.yaml
    clients:
      - url: http://loki:3100/loki/api/v1/push
        tenant_id: default
    scrape_configs:
      # 采集 shop-agent namespace 所有容器日志（静态路径，兼容 Docker Desktop）
      - job_name: shop-agent-pods
        static_configs:
          - targets: [localhost]
            labels:
              job: shop-agent-pods
              namespace: shop-agent
              __path__: /var/log/pods/shop-agent_*/*/*.log
        pipeline_stages:
          # 解析 JSON 日志（shop-agent 使用 LOG_FORMAT=json）
          - json:
              expressions:
                level: level
                logger: logger
                event: event
                service: service
                trace_id: trace_id
                request_id: request_id
          # 提取日志级别作为标签
          - labels:
              level:
              service:
          # 从文件路径提取 pod 和 container 名
          - regex:
              expression: '/var/log/pods/shop-agent_(?P<pod>[^/]+)_[^/]+/(?P<container>[^/]+)/'
          - labels:
              pod:
              container:

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: shop-agent
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:3.2.1
          args:
            - -config.file=/etc/promtail/promtail.yaml
            - -config.expand-env=true
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: promtail-config
              mountPath: /etc/promtail
            - name: varlog
              mountPath: /var/log
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: positions
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: promtail-config
          configMap:
            name: promtail-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: positions
          emptyDir: {}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: shop-agent

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: shop-agent
