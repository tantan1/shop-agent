apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-agent-debug
  namespace: shop-agent
  labels:
    app: shop-agent-debug
spec:
  replicas: 1
  selector:
    matchLabels: { app: shop-agent-debug }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: shop-agent-debug }
    spec:
      containers:
      - name: shop-agent
        image: ${IMAGE_PREFIX}shop-agent:${IMAGE_TAG}
        imagePullPolicy: ${IMAGE_PULL_POLICY}
        ports:
        - { containerPort: 8000, name: http }
        - { containerPort: 8001, name: probe }
        - { containerPort: 5678, name: debug }
        env:
        - { name: SERVICE_NAME, value: "shop-agent" }
        - { name: ENABLE_METRICS, value: "true" }
        - { name: LOG_FORMAT, value: "json" }
        - { name: DEBUG, value: "1" }
        - { name: DEBUG_WAIT_FOR_CLIENT, value: "0" }
        - { name: REDIS_HOST, value: "redis" }
        - { name: POSTGRES_HOST, value: "postgres" }
        - { name: PGVECTOR_HOST, value: "postgres" }
        - { name: PG_DATABASE, value: "shop-agent" }
        - { name: VECTOR_STORE_PROVIDER, value: "pgvector" }
        - { name: LLM_GATEWAY_URL, value: "http://gateway:8001/v1" }
        - { name: ORDER_SERVICE_URL, value: "http://order-service:80" }
        - { name: MILVUS_PORT, value: "19530" }
        - { name: LANGFUSE_HOST, value: "http://langfuse-web:3000" }
        - { name: LANGFUSE_BASE_URL, value: "http://langfuse-web:3000" }
        - { name: LANGFUSE_PUBLIC_KEY, value: "pk-lf-6efb654a-9e5d-4028-8707-5bc5f75b6ad5" }
        - { name: LANGFUSE_SECRET_KEY, value: "sk-lf-a1052576-156f-496c-9b5d-7c3eb330fba8" }
        - { name: EMBEDDING_MODEL, value: "./models/BAAI/bge-m3" }
        - { name: EMBEDDING_PROVIDER, value: "ollama" }
        - { name: OLLAMA_EMBEDDING_MODEL, value: "bge-m3" }
        - { name: RERANKER_LOCAL_MODEL_PATH, value: "./models/BAAI/bge-reranker-base" }
        - { name: LOCAL_MODEL_BACKEND, value: "ollama" }
        - { name: OLLAMA_BASE_URL, value: "http://ollama:11434" }
        - { name: OLLAMA_PARAM_MODEL, value: "unified" }
        - { name: OLLAMA_TOOL_SELECTOR_MODEL, value: "unified" }
        - { name: step2_safety_local_model_enabled, value: "false" }
        - { name: AWS_ENDPOINT_URL, valueFrom: { secretKeyRef: { name: app-secrets, key: S3_ENDPOINT } } }
        - { name: AWS_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: app-secrets, key: AWS_ACCESS_KEY_ID } } }
        - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: app-secrets, key: AWS_SECRET_ACCESS_KEY } } }
        - { name: REDIS_AUTH, valueFrom: { secretKeyRef: { name: app-secrets, key: REDIS_AUTH } } }
        - { name: PGVECTOR_PASSWORD, valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD } } }
        - { name: FIXED_API_KEY, valueFrom: { secretKeyRef: { name: app-secrets, key: FIXED_API_KEY } } }
        - { name: LLM_ADAPTER_TYPE, value: "${LLM_ADAPTER_TYPE}" }
        - { name: MOCK_LLM_LATENCY_MIN, value: "${MOCK_LLM_LATENCY_MIN}" }
        - { name: MOCK_LLM_LATENCY_MAX, value: "${MOCK_LLM_LATENCY_MAX}" }
        - { name: MOCK_LLM_ERROR_RATE, value: "${MOCK_LLM_ERROR_RATE}" }
        - { name: MOCK_LLM_OUTPUT_TOKENS, value: "${MOCK_LLM_OUTPUT_TOKENS}" }
        - { name: CHAT_RATE_LIMIT, value: "${CHAT_RATE_LIMIT}" }
        - { name: GLOBAL_RATE_LIMIT, value: "${GLOBAL_RATE_LIMIT}" }
        - { name: SW_AGENT_NAME, value: "shop-agent" }
        - { name: SW_AGENT_COLLECTOR_BACKEND_SERVICES, value: "skywalking-oap:4317" }
        - { name: SW_AGENT_SAMPLE_RATE, value: "1" }
        - { name: SW_AGENT_ENABLED, value: "true" }
        livenessProbe:
          httpGet: { path: /healthz, port: 8001 }
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet: { path: /readyz, port: 8001 }
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests: { cpu: "500m", memory: "1Gi" }
          limits:   { cpu: "2", memory: "2Gi" }
        volumeMounts:
        - { name: model-data, mountPath: /code/models/BAAI, readOnly: true }
      volumes:
      - name: model-data
        persistentVolumeClaim: { claimName: model-data }
---
apiVersion: v1
kind: Service
metadata:
  name: shop-agent-debug
  namespace: shop-agent
spec:
  selector: { app: shop-agent-debug }
  ports:
    - { name: http, port: 80, targetPort: 8000 }
    - { name: debug, port: 5678, targetPort: 5678 }
