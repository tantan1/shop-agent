apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-agent-ingress
  namespace: shop-agent
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rewrite-target: "/$2"
spec:
  rules:
  - host: localhost
    http:
      paths:
      - path: /agent(/|$)(.*)
        pathType: ImplementationSpecific
        backend: { service: { name: shop-agent, port: { number: 80 } } }
      - path: /gateway(/|$)(.*)
        pathType: ImplementationSpecific
        backend: { service: { name: gateway, port: { number: 80 } } }
      - path: /monitor(/|$)(.*)
        pathType: ImplementationSpecific
        backend: { service: { name: monitoring-agent, port: { number: 80 } } }
      - path: /order(/|$)(.*)
        pathType: ImplementationSpecific
        backend: { service: { name: order-service, port: { number: 80 } } }
