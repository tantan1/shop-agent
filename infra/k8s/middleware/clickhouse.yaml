# ClickHouse with built-in Keeper（替代独立 ZooKeeper）
# 数据持久化到 PVC，避免重启丢 schema（Langfuse 的 ClickHouse 表由此自动迁移建立）
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-data
  namespace: shop-agent
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
  namespace: shop-agent
data:
  01-keeper.xml: |
    <clickhouse>
        <logger>
            <level>trace</level>
            <console>true</console>
        </logger>
        <keeper_server>
            <tcp_port>9181</tcp_port>
            <server_id>1</server_id>
            <raft_configuration>
                <server>
                    <id>1</id>
                    <hostname>clickhouse</hostname>
                    <port>9234</port>
                </server>
            </raft_configuration>
        </keeper_server>
        <zookeeper>
            <node>
                <host>clickhouse</host>
                <port>9181</port>
            </node>
        </zookeeper>
        <remote_servers>
            <default>
                <shard>
                    <internal_replication>true</internal_replication>
                    <replica>
                        <host>clickhouse</host>
                        <port>9000</port>
                    </replica>
                </shard>
            </default>
        </remote_servers>
        <macros>
            <cluster>default</cluster>
            <shard>01</shard>
            <replica>clickhouse-01</replica>
        </macros>
        <listen_host>0.0.0.0</listen_host>
    </clickhouse>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  namespace: shop-agent
  labels: { app: clickhouse }
spec:
  replicas: 1
  selector: { matchLabels: { app: clickhouse } }
  template:
    metadata: { labels: { app: clickhouse } }
    spec:
      containers:
      - name: clickhouse
        image: ${CLICKHOUSE_IMAGE}
        env:
        - { name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1" }
        - { name: CLICKHOUSE_PASSWORD, value: "clickhouse123" }
        ports:
        - { name: http, containerPort: 8123 }
        - { name: native, containerPort: 9000 }
        - { name: keeper, containerPort: 9181 }
        volumeMounts:
        - { name: data, mountPath: /var/lib/clickhouse }
        - { name: config, mountPath: /etc/clickhouse-server/config.d }
        resources: { requests: { cpu: "250m", memory: "1Gi" }, limits: { cpu: "2", memory: "1536Mi" } }
      volumes:
      - name: data
        persistentVolumeClaim: { claimName: clickhouse-data }
      - name: config
        configMap: { name: clickhouse-config }
---
apiVersion: v1
kind: Service
metadata: { name: clickhouse, namespace: shop-agent }
spec:
  selector: { app: clickhouse }
  ports:
  - { name: http, port: 8123, targetPort: 8123 }
  - { name: native, port: 9000, targetPort: 9000 }
  - { name: keeper, port: 9181, targetPort: 9181 }
