# Loki 集中日志（单二进制单实例 + PVC 持久化 + :3100 Service）。
# 日志来源：三服务 stdout JSON → OTel Agent → OTel Gateway(loki exporter) → 本服务。
# 阶段六将追加 loki-rules.yaml ConfigMap（ruler 告警规则），并打通 Alertmanager。
apiVersion: v1
kind: ConfigMap
metadata: { name: loki-config, namespace: shop-agent }
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 168h
      reject_old_samples: true
      reject_old_samples_max_age: 168h
    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules
      rule_path: /tmp/loki/rules
      alertmanager_url: http://alertmanager:9093
      enable_api: true
      ring:
        kvstore:
          store: inmemory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: shop-agent
  labels: { app: loki }
spec:
  replicas: 1
  selector: { matchLabels: { app: loki } }
  template:
    metadata: { labels: { app: loki } }
    spec:
      containers:
      - name: loki
        image: ${LOKI_IMAGE}
        args: ["-config.file=/etc/loki/loki.yaml"]
        ports: [{ containerPort: 3100 }]
        readinessProbe:
          httpGet: { path: /ready, port: 3100 }
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /ready, port: 3100 }
          initialDelaySeconds: 10
          periodSeconds: 15
        volumeMounts:
        - { name: config, mountPath: /etc/loki }
        - { name: data, mountPath: /loki }
        - { name: rules, mountPath: /loki/rules/fake }   # 阶段六：ruler 规则（<tenant>/ 下，auth_enabled=false 时租户为 fake）
        resources: { requests: { cpu: "200m", memory: "512Mi" }, limits: { cpu: "500m", memory: "1Gi" } }
      volumes:
      - name: config
        configMap: { name: loki-config }
      - name: data
        persistentVolumeClaim: { claimName: loki-data }
      - name: rules
        configMap: { name: loki-rules }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: loki-data, namespace: shop-agent }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }
  storageClassName: "${STORAGE_CLASS}"   # OKE: oci-bv / 本机: standard
---
apiVersion: v1
kind: Service
metadata: { name: loki, namespace: shop-agent }
spec:
  selector: { app: loki }
  ports: [{ port: 3100, targetPort: 3100 }]
