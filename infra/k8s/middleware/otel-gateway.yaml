apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-gateway-config
  namespace: shop-agent
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
      redaction:
        allow_all_keys: true
        blocked_values:
          - '\d{17}[\dXx]'
          - '1[3-9]\d{9}'
          - '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
          - '\d{16,19}'
        summary: silent
      transform:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(trace_id, attributes["trace_id"]) where attributes["trace_id"] != nil and trace_id == nil
              - set(span_id, attributes["span_id"]) where attributes["span_id"] != nil and span_id == nil
      batch: { send_batch_size: 1000, timeout: 5s }
    exporters:
      loki:
        endpoint: http://loki:3100/loki/api/v1/push
      otlp/skywalking:
        endpoint: skywalking-oap:4317
        tls: { insecure: true }
        headers:
          X-OTEL-TOKEN: "dummy-token"
      otlphttp/langfuse:
        endpoint: http://langfuse-web:3000/api/public/otel/v1/traces
        tls: { insecure: true }
        headers:
          Authorization: "Basic bG9jYWwtbGFuZ2Z1c2Uta2V5OmRlbW8"
          x-langfuse-ingestion-version: "4"
    service:
      telemetry:
        metrics:
          address: 0.0.0.0:8888
          level: detailed
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, redaction, transform, batch]
          exporters: [loki]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/skywalking, otlphttp/langfuse]
---
apiVersion: v1
kind: Secret
metadata:
  name: otel-gateway-secret
  namespace: shop-agent
type: Opaque
stringData:
  auth-token: \
---
apiVersion: v1
kind: Service
metadata:
  name: otel-gateway
  namespace: shop-agent
spec:
  selector: { app: otel-gateway }
  ports:
    - { name: grpc, port: 4317, targetPort: 4317 }
    - { name: http, port: 4318, targetPort: 4318 }
    - { name: metrics, port: 8888, targetPort: 8888 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-gateway
  namespace: shop-agent
  labels: { app: otel-gateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app: otel-gateway }
  template:
    metadata:
      labels: { app: otel-gateway }
    spec:
      containers:
      - name: otel-gateway
        image: ${OTEL_GATEWAY_IMAGE}
        args: ["--config=/etc/otel/config.yaml"]
        ports:
          - { containerPort: 4317, name: grpc }
          - { containerPort: 4318, name: http }
          - { containerPort: 8888, name: metrics }
        env:
          - { name: OTEL_GATEWAY_AUTH_TOKEN, valueFrom: { secretKeyRef: { name: otel-gateway-secret, key: auth-token } } }
        volumeMounts:
          - { mountPath: /etc/otel, name: config }
        resources:
          requests: { cpu: "250m", memory: "256Mi" }
          limits: { cpu: "1", memory: "512Mi" }
      volumes:
        - name: config
          configMap:
            name: otel-gateway-config
