apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: shop-agent
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'shop-agent'
        orgId: 1
        folder: 'shop-agent'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 15
        options:
          path: /var/lib/grafana/dashboards
      - name: 'shop-agent-loki'
        orgId: 1
        folder: 'shop-agent'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 15
        options:
          path: /var/lib/grafana/dashboards-loki