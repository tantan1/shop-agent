apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: shop-agent
  labels: { app: redis }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  strategy: { type: Recreate }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
      - name: redis
        image: ${REDIS_IMAGE}
        command: ["redis-server"]
        args: ["--requirepass", "$(REDIS_AUTH)"]
        env:
        - name: REDIS_AUTH
          valueFrom: { secretKeyRef: { name: app-secrets, key: REDIS_AUTH } }
        ports: [{ containerPort: 6379 }]
        livenessProbe:
          tcpSocket: { port: 6379 }
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          tcpSocket: { port: 6379 }
          initialDelaySeconds: 5
          periodSeconds: 5
        resources: { requests: { cpu: "100m", memory: "256Mi" }, limits: { cpu: "250m", memory: "512Mi" } }
        volumeMounts:
        - { name: data, mountPath: /data }
      volumes:
      - name: data
        persistentVolumeClaim: { claimName: redis-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: redis-data, namespace: shop-agent }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }
  storageClassName: "${STORAGE_CLASS}"   # OKE: oci-bv / 本机: standard
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: shop-agent }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
