# OCI Object Storage 作为 S3 兼容层，替代 docker-compose 里的 MinIO。
# 凭据由 CI 注入（见 deploy.yml / .env.example 的 S3_ENDPOINT / AWS_*）。
# Langfuse / 业务 S3 客户端统一走此 Secret。
apiVersion: v1
kind: Secret
metadata: { name: object-storage, namespace: shop-agent }
type: Opaque
stringData:
  S3_ENDPOINT: "${S3_ENDPOINT}"
  AWS_ENDPOINT_URL: "${S3_ENDPOINT}"
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
  AWS_REGION: "${OCI_REGION}"
  GRAFANA_API_KEY: "${GRAFANA_API_KEY}"
