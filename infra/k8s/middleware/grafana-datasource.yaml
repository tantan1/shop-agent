apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: shop-agent
  labels:
    grafana_datasource: "1"
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      # Prometheus 数据源（shop-agent 指标）
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
        jsonData:
          timeInterval: "15s"
          queryTimeout: "60s"
          httpMethod: "POST"
      
      # SkyWalking 数据源（链路追踪）
      - name: SkyWalking
        type: grafana-skywalking-datasource
        access: proxy
        url: http://skywalking-oap:12800
        isDefault: false
        editable: true
        jsonData:
          queryTimeout: "60s"

      # Loki 数据源（日志）
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: false
        editable: true
        jsonData:
          maxLines: 1000