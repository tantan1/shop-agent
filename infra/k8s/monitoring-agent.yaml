# ── 自愈最小 RBAC（demo 故障注入/修复用）────────────────────────────────────
# monitoring-agent 仅需在 shop-agent 命名空间内 patch deployments/scale
# （把 redis 副本数在 0/1 间切换），不授予 get/list/watch/delete/exec 等权限。
# SA 默认挂载的 token 由下式自动投影；禁用 automount 之外的任何提权。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitoring-agent
  namespace: shop-agent
  labels: { app: monitoring-agent }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitoring-agent-remediate
  namespace: shop-agent
  labels: { app: monitoring-agent }
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]   # 仅读取目标 deployment 元信息做校验
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monitoring-agent-remediate
  namespace: shop-agent
  labels: { app: monitoring-agent }
subjects:
  - kind: ServiceAccount
    name: monitoring-agent
    namespace: shop-agent
roleRef:
  kind: Role
  name: monitoring-agent-remediate
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-agent
  namespace: shop-agent
  labels:
    app: monitoring-agent
spec:
  replicas: 1
  selector:
    matchLabels: { app: monitoring-agent }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: monitoring-agent }
    spec:
      serviceAccountName: monitoring-agent
      automountServiceAccountToken: true
      containers:
      - name: monitoring-agent
        image: ${IMAGE_PREFIX}monitoring-agent:${IMAGE_TAG}
        imagePullPolicy: ${IMAGE_PULL_POLICY}
        ports: [{ containerPort: 9091 }]
        env:
        - { name: SERVICE_NAME, value: "monitoring-agent" }
        - { name: LOG_FORMAT, value: "json" }
        - { name: LOG_LEVEL, value: "INFO" }
        - { name: LOKI_URL, value: "http://loki:3100" }
        - { name: SHOP_AGENT_URL, value: "http://shop-agent:8000/health" }
        - { name: GATEWAY_URL, value: "http://gateway:8001/health" }
        - { name: REDIS_HOST, value: "redis" }
        - { name: REDIS_PASSWORD, valueFrom: { secretKeyRef: { name: app-secrets, key: REDIS_AUTH } } }
        - { name: POSTGRES_HOST, value: "postgres" }
        - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD } } }
        - { name: STATIC_TARGETS, value: "prometheus=http://prometheus:9090/-/healthy" }
        - { name: GRAFANA_URL, value: "http://grafana:3000" }
        - name: GRAFANA_API_KEY
          valueFrom: { secretKeyRef: { name: grafana-api-token, key: GRAFANA_API_KEY } }
        - name: MONITORING_WEBHOOK_TOKEN
          valueFrom: { secretKeyRef: { name: app-secrets, key: MONITORING_WEBHOOK_TOKEN } }
        livenessProbe:
          httpGet: { path: /health, port: 9091 }
          initialDelaySeconds: 15
          periodSeconds: 15
        readinessProbe:
          httpGet: { path: /health, port: 9091 }
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests: { cpu: "100m", memory: "256Mi" }
          limits:   { cpu: "250m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-agent
  namespace: shop-agent
spec:
  selector: { app: monitoring-agent }
  ports: [{ port: 80, targetPort: 9091 }]
