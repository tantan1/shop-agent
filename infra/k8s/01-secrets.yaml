# 密钥集中管理：所有敏感值在 GitHub Secrets 注入，本文件仅声明占位/引用。
# 生产请改用 OCI Vault 或 Sealed Secrets / External Secrets Operator。
#
# 通过 CI 注入的 secret（见 .github/workflows/deploy.yml）：
#   kubectl create secret generic app-secrets -n shop-agent \
#     --from-literal=REDIS_AUTH=... \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=OPENAI_API_KEY=... \
#     --from-literal=AZURE_OPENAI_API_KEY=... \
#     --from-literal=AZURE_OPENAI_ENDPOINT=... \
#     --from-literal=FIXED_API_KEY=... \
#     --from-literal=AWS_ACCESS_KEY_ID=... \
#     --from-literal=AWS_SECRET_ACCESS_KEY=... \
#     --from-literal=S3_ENDPOINT=... \
#     --from-literal=LANGFUSE_INIT_USER_PASSWORD=...
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: shop-agent
type: Opaque
stringData:
  # CI 部署时会用 envsubst 注入真实值；此处保留空串作为占位，避免 apply 失败。
  REDIS_AUTH: "${REDIS_AUTH}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  OPENAI_API_KEY: "${OPENAI_API_KEY}"
  AZURE_OPENAI_API_KEY: "${AZURE_OPENAI_API_KEY}"
  AZURE_OPENAI_ENDPOINT: "${AZURE_OPENAI_ENDPOINT}"
  FIXED_API_KEY: "${FIXED_API_KEY}"
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
  S3_ENDPOINT: "${S3_ENDPOINT}"
  LANGFUSE_INIT_USER_PASSWORD: "${LANGFUSE_INIT_USER_PASSWORD}"
  ORDER_DATABASE_URL: "${ORDER_DATABASE_URL}"
  LANGFUSE_DATABASE_URL: "${LANGFUSE_DATABASE_URL}"
  GRAFANA_API_KEY: "${GRAFANA_API_KEY}"
  # 百炼/通义大模型 key（统一由 Gateway 持有，经此处注入 Gateway；shop-agent 不再使用）
  TONGYI_API_KEY: "${TONGYI_API_KEY}"
