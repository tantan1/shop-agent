# 注入检测基线（随包生产默认，归 rules/ 公共包；绝不零规则启动）
# 结构：patterns 列表，每项：
#   type  : 命中类型标签
#   regex : 确定性已知攻击模式（社区成熟规则 + 中文补充，不自手搓）
#   mask  : 占位（注入检测只用 deny/flag，不掩码，字段保留兼容结构）
#   applies_to : 规则生效的角色白名单（信任模型分级，见下）。
#               省略或为空 = 对所有角色生效。
#
# 信任模型（四级角色，按不可信度升序）：
#   system  : 平台自身拼装，最可信 —— 仅极少数规则需扫（默认跳过）。
#   assistant: LLM 生成（被用户输入塑造），中风险 —— 间接注入面。
#   tool    : 外部系统返回（数据库/API/网页/邮件），高风险 —— 投毒头号入口。
#   user    : 外部用户请求，高风险 —— 攻击主入口。
# 处置分级（见 gateway/hooks/injection.py check()）：
#   user   命中 → deny（403 拦截）。
#   system/assistant/tool 命中 → 不阻断（否则自伤正常业务），
#            改为 flagged（标记不可信 + 打点告警），由上游做隔离/人在回路确认。
#
# 设计注记：
# - `system_prompt_extract`（提示词索取）只对 user 生效：assistant/tool 不会自然产生
#   索取句式，且其若真回显系统提示词，属"泄露已发生"，应靠出向脱敏/隔离而非入向 deny。
# - 中文匹配必须是「指令型」表达，不能用宽泛名词（如"系统提示""你的设定"）——
#   这些是业务正常高频词，用它们会自伤正常请求（scope-10 §3 反例）。

patterns:
  - type: jailbreak
    # 允许「指令名 + 夹带（PII/噪声，限长防回溯爆炸）+ 目标词」的形态，
    # 覆盖 `ignore previous instructions` / `ignore all rules` /
    # `ignore 13800138000 previous instructions`（PII 夹带不打断检测，scope-10 §3 反例1）。
    applies_to: [user, assistant, tool]
    regex: '(?i)ignore\s+(all\s+)?[\w\W]{0,60}?(previous|prior|above|)\s*(instructions|rules|commands)'
    mask: full
  - type: jailbreak_zh
    # 中文越狱：忽略/无视/忘记 之前/上文/以前 的 指令/规则/设定/提示。
    # 覆盖「忽略之前所有指令」「忘记上文所有规则」「无视之前的设定」等。
    applies_to: [user, assistant, tool]
    regex: '(忽略|无视|忘(记|掉|却)|别管|抛开)[\s\S]{0,30}?(之前|以前|上文|上面|前述)[\s\S]{0,20}?(指令|规则|设定|提示|要求|prompt|约束)'
    mask: full
  - type: forget_zh
    # 中文「忘掉一切 / 重新开始」形态
    applies_to: [user, assistant, tool]
    regex: '(?i)(忘记|忘掉|无视|忽略)[\s\S]{0,20}?(一切|所有|全部|之前|上面的)'
    mask: full
  - type: system_prompt_extract
    # 索取 / 泄露系统提示词（提示词注入攻击），仅针对 user 角色（用户可控输入）。
    # 中文匹配必须是「指令型」表达，不能用宽泛名词「系统提示」「你的设定」——
    # 这些是业务正常文本里的高频词（如 shop-agent 在 user 消息前加的「[系统提示] 意图上下文」），
    # 用它们会自伤正常请求。只匹配明确的窃取/越狱句式。
    # 角色限制见 applies_to：仅 user 角色生效；system/assistant/tool 由平台拼装或
    # LLM/外部产物产生，不是「主动索取」攻击面。
    applies_to: [user]
    regex: '(?i)(输出你的(完整)?(系统)?(提示词|提示|设定)|泄露你的(系统)?(提示词|设定)|告诉我你的(系统)?(设定|提示词)|你的(完整)?(系统)?(提示词|设定)是什么|your\s+system\s+prompt|reveal\s+your\s+(instructions|prompt)|show\s+me\s+your\s+prompt|print\s+your\s+(system\s+)?prompt|dump\s+your\s+prompt)'
    mask: full
  - type: indirect_injection
    # 间接注入（数据回流藏指令）：出现在 assistant/tool 内容里、伪装成正常数据的指令。
    # 用户直接发这类反而弱（会被 jailbreak 类兜底）；重点是工具/LLM 返回的外部数据
    # 夹带「以下是新指令」「system: ...」等，进入下一轮 prompt 被当指令执行。
    # 对 user 不单独列（与 jailbreak 重叠），聚焦 assistant/tool 两个不可信回流面。
    applies_to: [assistant, tool]
    regex: '(?i)(忽略(之前|以上|上述|所有).{0,20}指令|disregard.{0,20}(previous|above|all).{0,20}(instruction|rule)|new\s+instruction\s*:|system\s*:\s*|作为(系统|管理员|开发者).{0,10}(现在|请)|ignore\s+(all\s+)?(previous|above))'
    mask: full
  - type: role_override
    applies_to: [user, assistant, tool]
    regex: '(?i)(you\s+are\s+now|act\s+as|pretend\s+to\s+be)\s+[^.]{0,40}(without\s+(any\s+)?(restriction|filter|rule)|DAN|jailbreak)'
    mask: full
  - type: role_override_zh
    # 中文角色覆盖：你现在/你现在是/假装你是/扮演
    applies_to: [user, assistant, tool]
    regex: '(你现在(是|要|就)|你现在是|假装你(是|变成)|请你扮演|你可以扮演)[\s\S]{0,20}?(角色|助手|AI|模型|系统|bot)'
    mask: full
  - type: system_injection
    # 结构化分隔符注入（[SYSTEM] / ### instruction / <system>），对所有角色生效，
    # 包括 tool 返回里夹带的伪分隔符。
    applies_to: [user, assistant, tool]
    regex: '\[SYSTEM\]|###\s*instruction|<\s*system\s*>'
    mask: full
  - type: delimiter_escape
    applies_to: [user, assistant, tool]
    regex: '(?i)(forget\s+(everything|all\s+previous)|disregard\s+(the\s+)?(above|previous))'
    mask: full
  - type: dangerous_cmd
    applies_to: [user, assistant, tool]
    regex: '(?i)(rm\s+-rf|sudo\s+rm|format\s+(c:|the\s+disk)|del\s+/[fsq])'
    mask: full
  - type: sql_injection
    # 可选前导分号，覆盖 `DROP TABLE users;` 与 `; DROP TABLE`。
    applies_to: [user, assistant, tool]
    regex: '(?i)(;\s*)?drop\s+table|union\s+select|or\s+1=1\s*--|/\*.?\*/'
    mask: full
  - type: xss
    applies_to: [user, assistant, tool]
    regex: '(?i)(<script>|onerror\s*=|javascript:)'
    mask: full
