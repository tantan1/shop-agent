<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop-Agent 智能客服演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
  header { background: #1a73e8; color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 18px; font-weight: 600; }
  .api-key-wrap { display: flex; align-items: center; gap: 8px; }
  .api-key-wrap label { font-size: 13px; opacity: .9; }
  .api-key-wrap input { padding: 6px 10px; border: none; border-radius: 6px; width: 260px; font-size: 13px; }
  .main { flex: 1; display: flex; overflow: hidden; }
  .chat-panel { flex: 1; display: flex; flex-direction: column; }
  .messages { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { display: flex; margin-bottom: 16px; }
  .msg.user { justify-content: flex-end; }
  .msg .bubble { max-width: 70%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg.user .bubble { background: #1a73e8; color: #fff; border-bottom-right-radius: 4px; }
  .msg.agent .bubble { background: #fff; color: #333; border: 1px solid #e0e0e0; border-bottom-left-radius: 4px; }
  .msg .meta { font-size: 11px; color: #999; margin-top: 4px; }
  .msg.user .meta { text-align: right; }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-right: 6px; }
  .tag.cache { background: #e8f5e9; color: #2e7d32; }
  .tag.escalated { background: #ffebee; color: #c62828; }
  .tag.waiting { background: #fff3e0; color: #e65100; }
  .tag.steps { background: #e3f2fd; color: #1565c0; }
  .input-bar { display: flex; gap: 10px; padding: 16px 20px; background: #fff; border-top: 1px solid #e0e0e0; }
  .input-bar textarea { flex: 1; resize: none; border: 1px solid #ddd; border-radius: 8px; padding: 10px 12px; font-size: 14px; font-family: inherit; min-height: 44px; max-height: 120px; }
  .input-bar button { padding: 10px 24px; background: #1a73e8; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
  .input-bar button:disabled { background: #a0c4f0; cursor: not-allowed; }
  .input-bar .upload-btn { background: #fff; color: #1a73e8; border: 1px solid #1a73e8; }
  .side-panel { width: 320px; background: #fff; border-left: 1px solid #e0e0e0; overflow-y: auto; padding: 16px; }
  .side-panel h3 { font-size: 14px; color: #333; margin-bottom: 12px; }
  .step-item { background: #f8f9fa; border-radius: 8px; padding: 10px; margin-bottom: 8px; font-size: 12px; }
  .step-item .name { font-weight: 600; color: #1a73e8; }
  .step-item .status { color: #2e7d32; }
  .step-item pre { background: #fff; border-radius: 4px; padding: 6px; margin-top: 6px; font-size: 11px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
  .approve-bar { background: #fff3e0; border: 1px solid #ffb74d; border-radius: 8px; padding: 12px; margin: 8px 0; }
  .approve-bar button { margin-right: 8px; padding: 6px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; }
  .approve-bar .yes { background: #2e7d32; color: #fff; }
  .approve-bar .no { background: #c62828; color: #fff; }
  .img-preview { max-width: 120px; max-height: 120px; border-radius: 8px; margin-top: 6px; }
  .empty { text-align: center; color: #aaa; margin-top: 60px; font-size: 14px; }
  .suggest { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 12px; }
  .suggest button { background: #fff; border: 1px solid #1a73e8; color: #1a73e8; border-radius: 16px; padding: 6px 14px; font-size: 12px; cursor: pointer; }
  .suggest button:hover { background: #e3f2fd; }
  /* ── 左侧回答：JSON 卡片 & 物流时间线 ── */
  .bubble .json-card { background: #fff; border: 1px solid #e3e8ee; border-radius: 8px; padding: 10px 12px; margin-top: 6px; white-space: normal; }
  .bubble .json-card .kv-row { display: flex; gap: 8px; font-size: 13px; padding: 4px 0; border-bottom: 1px dashed #eef1f4; }
  .bubble .json-card .kv-row:last-child { border-bottom: none; }
  .bubble .json-card .kv-key { color: #1565c0; font-weight: 600; min-width: 90px; flex-shrink: 0; }
  .bubble .json-card .kv-val { color: #333; word-break: break-all; flex: 1; }
  .bubble .json-card .sub-card { margin-top: 4px; margin-left: 12px; border-left: 2px solid #e3f2fd; padding-left: 8px; }
  .bubble .json-card .badge { display: inline-block; background: #f1f5f9; color: #475569; border-radius: 4px; padding: 1px 6px; font-size: 11px; margin-right: 4px; }
  .bubble .timeline-wrap { margin-top: 4px; white-space: normal; }
  .bubble .tl-head { font-size: 13px; color: #333; margin-bottom: 8px; }
  .bubble .tl-empty { font-size: 13px; color: #c62828; padding: 6px 0; }
  .bubble .timeline { position: relative; padding-left: 22px; }
  .bubble .tl-item { position: relative; padding: 0 0 14px 0; }
  .bubble .tl-item:last-child { padding-bottom: 0; }
  .bubble .tl-item::before { content: ''; position: absolute; left: -16px; top: 6px; bottom: -6px; width: 2px; background: #d8e3f0; }
  .bubble .tl-item:last-child::before { display: none; }
  .bubble .tl-dot { position: absolute; left: -22px; top: 3px; width: 11px; height: 11px; border-radius: 50%; background: #c5d6ea; border: 2px solid #fff; box-shadow: 0 0 0 1px #c5d6ea; }
  .bubble .tl-item.latest .tl-dot { background: #1a73e8; box-shadow: 0 0 0 1px #1a73e8; }
  .bubble .tl-item.latest .tl-status { color: #1a73e8; font-weight: 700; }
  .bubble .tl-status { font-size: 13px; color: #333; }
  .bubble .tl-time { font-size: 12px; color: #999; margin-top: 2px; }
  .bubble .tl-loc { font-size: 12px; color: #777; margin-top: 1px; }
  .bubble .tl-idx { position: absolute; right: 0; top: 2px; font-size: 11px; color: #bbb; }
</style>
</head>
<body>
<header>
  <h1>🛒 Shop-Agent 智能客服演示</h1>
  <div class="api-key-wrap">
    <label>API Key</label>
    <input id="apiKey" type="password" placeholder="请输入 X-API-Key">
  </div>
</header>

<div class="main">
  <div class="chat-panel">
    <div class="suggest" id="suggestBar">
      <button onclick="sendSuggestion('我的订单 WB202405270001 到哪了？')">查订单</button>
      <button onclick="sendSuggestion('快递 SF1234567890 到哪了？')">查物流</button>
      <button onclick="sendSuggestion('我账户里还有多少余额？')">查余额</button>
      <button onclick="sendSuggestion('有什么优惠券可以用？')">查优惠券</button>
      <button onclick="sendSuggestion('这个电冰箱有什么功能？')">商品咨询</button>
      <!-- 申请退货（request-return）为敏感工具，需第二角色人工审批（HITL）；
           审批链路未接入前，界面上屏蔽该入口，避免走到无法完成的审批流程。 -->
    </div>
    <div class="messages" id="messages">
      <div class="empty" id="emptyHint">👋 你好！我是 Shop-Agent 智能客服。<br>试试上面的快捷问题，或直接输入你的问题。</div>
    </div>
    <div class="input-bar">
      <button class="upload-btn" id="uploadBtn" title="上传图片（OCR 演示）">📷</button>
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
      <textarea id="input" placeholder="输入你的问题…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="sendBtn">发送</button>
      <button id="correctBtn" title="标记上一次工具选择错误并指定正确工具（设计 4 d4-5）">🛠 纠正</button>
    </div>
  </div>
  <div class="side-panel">
    <h3>🔍 处理链路（steps）</h3>
    <div id="stepsPanel"><div class="empty" style="margin-top:20px">发送消息后，这里会展示 Agent 的处理步骤</div></div>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const stepsEl = document.getElementById('stepsPanel');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const correctBtn = document.getElementById('correctBtn');
const apiKeyEl = document.getElementById('apiKey');
const fileInput = document.getElementById('fileInput');
const uploadBtn = document.getElementById('uploadBtn');
const emptyHint = document.getElementById('emptyHint');

let conversationId = null;
let pendingImages = [];

// 恢复 API Key
apiKeyEl.value = localStorage.getItem('shop_agent_api_key') || '';
apiKeyEl.addEventListener('change', () => localStorage.setItem('shop_agent_api_key', apiKeyEl.value));

function addMessage(role, content, meta = {}, opts = {}) {
  emptyHint.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  let tags = '';
  if (meta.cache_hit) tags += '<span class="tag cache">缓存命中</span>';
  if (meta.status === 'escalated') tags += '<span class="tag escalated">已升级</span>';
  if (meta.status === 'waiting_for_confirmation') tags += '<span class="tag waiting">待审批</span>';
  if (meta.steps_count) tags += `<span class="tag steps">${meta.steps_count} 步</span>`;
  // content 默认按文本转义；opts.html=true 时视为已生成的安全 HTML
  const body = opts.html ? content : escapeHtml(content);
  div.innerHTML = `<div class="bubble">${body}${tags ? '<div style="margin-top:8px">' + tags + '</div>' : ''}</div>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

// ── 左侧会话回答渲染 ────────────────────────────────────────────────────────
// 规则：
//   1) 回答本身是 JSON → 渲染为卡片；其中含物流轨迹(tracking/details) → 时间线
//   2) 回答是普通文本 → 正常显示文本；若本次对话的步骤里带有物流轨迹，则在文本后补一条时间线
function stripThink(text) {
  if (typeof text !== 'string') return '';
  // 防御性剥离模型误吐出的 <think>...</think> 思考块（覆盖所有后端回复路径）
  let s = text.replace(/<think>[\s\S]*?<\/think>/gi, '');
  const open = s.search(/<think>/i);
  if (open >= 0) s = s.slice(0, open);
  return s.trim();
}

function renderBubbleContent(text, steps) {
  text = stripThink(text);
  const parsed = tryParseJson(text);
  if (parsed !== undefined) {
    if (isTracking(parsed)) return renderTimeline(parsed);
    return `<div class="json-card">${renderJson(parsed)}</div>`;
  }
  const tracking = extractTrackingFromSteps(steps);
  if (tracking) {
    return (text ? escapeHtml(text) : '') + renderTimeline(tracking);
  }
  return text ? escapeHtml(text) : '<span style="color:#999">（暂无回答内容）</span>';
}

function tryParseJson(text) {
  if (typeof text !== 'string') return undefined;
  let s = text.trim();
  const fence = s.match(/^```(?:json)?\s*([\s\S]*?)\s*```$/i);
  if (fence) s = fence[1].trim();
  if (!s || !(s[0] === '{' || s[0] === '[')) return undefined;
  try { return JSON.parse(s); } catch (e) { return undefined; }
}

// 判断是否物流轨迹结构：含 tracking 或 details 数组，且元素有 status/location
function isTracking(obj) {
  if (!obj || typeof obj !== 'object') return false;
  const list = Array.isArray(obj) ? obj : (obj.tracking || obj.details);
  if (!Array.isArray(list) || !list.length) return false;
  return list.some(it => it && typeof it === 'object' && ('status' in it || 'location' in it));
}

// 判断数组是否为物流轨迹：元素需含 status 且含 time/location（避免把工具结果 results
// 里 {action, status:'success', output} 这类包装误判为轨迹）
function isTrackingArray(arr) {
  return (
    Array.isArray(arr) &&
    arr.length > 0 &&
    arr.every(
      i =>
        i && typeof i === 'object' &&
        'status' in i && ('time' in i || 'location' in i)
    )
  );
}

// 从处理链 steps 中递归查找物流轨迹数组（兼容多种结构与 JSON 字符串嵌套）
function findTracking(obj) {
  if (obj == null) return null;
  if (typeof obj === 'string') {
    try {
      return findTracking(JSON.parse(obj));
    } catch (e) {
      return null;
    }
  }
  if (Array.isArray(obj)) {
    if (isTrackingArray(obj)) return obj;
    for (const it of obj) {
      const r = findTracking(it);
      if (r) return r;
    }
    return null;
  }
  if (typeof obj === 'object') {
    if (isTrackingArray(obj.tracking)) return obj.tracking;
    if (isTrackingArray(obj.details)) return obj.details;
    for (const k of Object.keys(obj)) {
      const r = findTracking(obj[k]);
      if (r) return r;
    }
  }
  return null;
}

function extractTrackingFromSteps(steps) {
  if (!steps || !steps.length) return null;
  for (const s of steps) {
    if (!s) continue;
    const candidates = [s.output_data, s.result, s.observation];
    for (let od of candidates) {
      if (typeof od === 'string') {
        try { od = JSON.parse(od); } catch (e) { od = null; }
      }
      if (!od) continue;
      const found = findTracking(od);
      if (found && found.length) return found;
    }
  }
  return null;
}

function renderTimeline(data) {
  const list = Array.isArray(data) ? data : (data.tracking || data.details || []);
  const num = (!Array.isArray(data) && (data.tracking_number || data.order_id)) ? (data.tracking_number || data.order_id) : '';
  const found = Array.isArray(data) ? true : (data.found !== false);
  const note = (!Array.isArray(data) && data.note) ? data.note : '';
  let html = '<div class="timeline-wrap">';
  if (num) html += `<div class="tl-head">运单号：<b>${escapeHtml(num)}</b></div>`;
  if (!found) {
    html += `<div class="tl-empty">${escapeHtml(note || '未查询到该运单的物流信息')}</div></div>`;
    return html;
  }
  if (!list.length) {
    html += `<div class="tl-empty">${escapeHtml(note || '暂无物流轨迹')}</div></div>`;
    return html;
  }
  html += '<div class="timeline">';
  list.forEach((it, i) => {
    const status = it && it.status != null ? String(it.status) : '';
    const time = it && it.time != null ? String(it.time) : '';
    const loc = it && it.location != null ? String(it.location) : '';
    html += `<div class="tl-item ${i === 0 ? 'latest' : ''}">
      <div class="tl-dot"></div>
      <div class="tl-body">
        <div class="tl-status">${escapeHtml(status)}</div>
        ${time ? `<div class="tl-time">${escapeHtml(time)}</div>` : ''}
        ${loc ? `<div class="tl-loc">${escapeHtml(loc)}</div>` : ''}
      </div>
      <div class="tl-idx">${i + 1}</div>
    </div>`;
  });
  html += '</div></div>';
  return html;
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// 把任意 JSON 值渲染成键值卡片（递归：对象→kv 行，数组→子卡片列表）
function renderJson(value, depth = 0) {
  if (value === null || value === undefined) return '<span class="kv-val">—</span>';
  if (typeof value === 'object') {
    if (Array.isArray(value)) {
      if (value.length === 0) return '<span class="kv-val">[]</span>';
      return value.map(v => `<div class="sub-card">${renderJson(v, depth + 1)}</div>`).join('');
    }
    const keys = Object.keys(value);
    if (keys.length === 0) return '<span class="kv-val">{}</span>';
    return keys.map(k => {
      const v = value[k];
      if (v !== null && typeof v === 'object') {
        return `<div class="kv-row"><span class="kv-key">${escapeHtml(k)}</span><div class="kv-val">${renderJson(v, depth + 1)}</div></div>`;
      }
      const valStr = (typeof v === 'boolean' || typeof v === 'number') ? String(v) : escapeHtml(String(v));
      return `<div class="kv-row"><span class="kv-key">${escapeHtml(k)}</span><span class="kv-val">${valStr}</span></div>`;
    }).join('');
  }
  return `<span class="kv-val">${escapeHtml(String(value))}</span>`;
}

function renderSteps(steps) {
  stepsEl.innerHTML = '<h3>🔍 处理链路（steps）</h3>';
  if (!steps || !steps.length) {
    stepsEl.innerHTML += '<div class="empty" style="margin-top:20px">无步骤信息</div>';
    return;
  }
  steps.forEach(s => {
    const item = document.createElement('div');
    item.className = 'step-item';
    const od = s.output_data;
    const hasOut = od && (Array.isArray(od) ? od.length : Object.keys(od).length);
    const outText = hasOut ? (typeof od === 'string' ? od : JSON.stringify(od, null, 2)) : '';
    item.innerHTML = `<div><span class="name">${s.step_order}. ${escapeHtml(s.step_name)}</span> <span class="status">[${escapeHtml(s.status)}]</span></div>${hasOut ? `<pre>${escapeHtml(outText)}</pre>` : ''}`;
    stepsEl.appendChild(item);
  });
}

// 审批（HITL）UI 已屏蔽：退款等敏感工具需第二角色人工审批，审批链路未接入前
// 不在界面暴露批准/拒绝入口，改为给出说明性提示。
function notifyApprovalPending() {
  addMessage(
    'agent',
    '该操作属于敏感操作，需要另一位有审批权限的人来处理，当前演示环境暂不支持。',
    { status: 'waiting_for_confirmation' }
  );
}

async function sendMessage(text) {
  const apiKey = apiKeyEl.value.trim();
  if (!apiKey) { alert('请先填写 API Key'); return; }
  if (!text.trim() && !pendingImages.length) return;

  addMessage('user', text || '📷 [图片]');
  sendBtn.disabled = true;
  sendBtn.textContent = '思考中…';

  const body = {
    message: text,
    conversation_id: conversationId,
    domain: 'ecommerce',
    stream: false,
  };
  if (pendingImages.length) {
    body.images = pendingImages;
    pendingImages = [];
  }

  try {
    const resp = await fetch('/agent/api/v1/chatagent/agent/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': apiKey },
      body: JSON.stringify(body)
    });
    const json = await resp.json();
    if (!resp.ok) {
      const err = json.data?.error || json.message || ('HTTP ' + resp.status);
      addMessage('agent', '❌ ' + err);
      return;
    }
    const data = json.data || {};
    conversationId = data.conversation_id || conversationId;
    addMessage('agent', renderBubbleContent(data.message, data.steps), {
      cache_hit: data.cache_hit,
      status: data.status,
      steps_count: data.steps ? data.steps.length : 0
    }, { html: true });
    if (data.steps) renderSteps(data.steps);
    // 审批 UI 已屏蔽：不再弹出批准/拒绝条，改为给出说明性提示
    if (data.status === 'waiting_for_confirmation') notifyApprovalPending();
  } catch (e) {
    addMessage('agent', '❌ 请求失败：' + e.message);
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = '发送';
  }
}

function sendSuggestion(text) {
  inputEl.value = text;
  sendMessage(text);
}

// 图片上传
uploadBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async () => {
  const files = Array.from(fileInput.files);
  fileInput.value = '';
  for (const f of files) {
    if (pendingImages.length >= 3) { alert('最多上传 3 张图片'); break; }
    const reader = new FileReader();
    reader.onload = () => {
      pendingImages.push(reader.result);
      addMessage('user', '📷 已添加图片：' + f.name);
    };
    reader.readAsDataURL(f);
  }
});

// 发送
sendBtn.addEventListener('click', () => {
  const text = inputEl.value.trim();
  inputEl.value = '';
  sendMessage(text);
});
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const text = inputEl.value.trim();
    inputEl.value = '';
    sendMessage(text);
  }
});

// ── 设计 4 d4-5：通用纠正按钮 ──────────────────────────────────────────────
function showCorrectBar() {
  if (!conversationId) { alert('请先发起一次对话'); return; }
  closeCorrectBar();
  const div = document.createElement('div');
  div.className = 'approve-bar';
  div.id = 'correctBar';
  div.innerHTML =
    '🔧 纠正上一次工具选择：<br>' +
    '错误工具 <input id="origTool" placeholder="如 request-return（可选）" style="width:150px">' +
    ' 正确工具 <input id="correctTool" placeholder="如 order_query（必填）" style="width:150px">' +
    ' <button class="yes" onclick="submitCorrection()">提交</button>' +
    '<button class="no" onclick="closeCorrectBar()">取消</button>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function closeCorrectBar() { const b = document.getElementById('correctBar'); if (b) b.remove(); }
async function submitCorrection() {
  const correctTool = document.getElementById('correctTool').value.trim();
  if (!correctTool) { alert('请填写正确工具名'); return; }
  const origTool = document.getElementById('origTool').value.trim() || null;
  closeCorrectBar();
  const apiKey = apiKeyEl.value.trim();
  if (!apiKey) { alert('请先填写 API Key'); return; }
  try {
    const resp = await fetch('/agent/api/v1/chatagent/agent/correction', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': apiKey },
      body: JSON.stringify({ conversation_id: conversationId, original_tool: origTool, correct_tool: correctTool }),
    });
    const json = await resp.json();
    const d = json.data || {};
    addMessage('agent',
      d.recorded
        ? '✅ 纠正已记录，将用于训练回流（trace_id: ' + (d.trace_id || 'n/a') + '）'
        : '⚠️ 纠正未记录（门控可能关闭或 Langfuse 未配置）', {});
  } catch (e) { addMessage('agent', '纠正提交失败：' + e.message); }
}
correctBtn.addEventListener('click', showCorrectBar);
</script>
