# 示例流程：退货全流程（阶段 1 示例产出 + 阶段 4.1 轻量版改造）
#
# 演示「控制流外移 + 数据流外移 + 安全底座不下放」：
# - 步骤顺序由图定义（查单→校验→确认→执行→回复），模型不决定走哪几步
# - 节点间参数走显式 GraphState 契约（read_from / write_to），不靠隐式拼接
# - request-return 为敏感 Skill（risk: high, hitl: true），只能被引用为黑盒，
#   挂输出过滤守卫 + 分布式锁，业务不可关闭（阶段 5.4/5.5）
# - 阶段 4.1 轻量版：原 validate / reply 两个 react 黑盒节点已改为 llm_call 单步生成，
#   去掉 ReAct 循环与工具精选，仅做校验话术 / 回复话术（高后果写库仍由 direct_tool 执行）

version: "1.0"

entry: normalize

# 显式 State 契约（阶段 1.5a）
state:
  fields:
    - name: messages
      type: list
      required: false
    - name: intent
      type: dict
      required: false
    - name: params
      type: dict
      required: true
    - name: tool_result
      type: any
      required: true
    - name: hitl_pending
      type: any
      required: false
    - name: thread_id
      type: string
      required: true

nodes:
  - id: normalize
    type: normalize

  - id: intent
    type: intent

  - id: query_order
    type: direct_tool
    config:
      skill: query-order
      read_from:
        - state: params
          required: true
      write_to:
        - state: tool_result
          from: result

  - id: validate
    # 轻量版 4.1：原 react 黑盒节点改为单步 LLM 校验（无工具循环、无精选）。
    # 读取上游 query_order 的查单结果，生成「能否退货」的校验话术。
    # 订单号已由上游确定性抽取定稿（params.order_id），llm_call 仅做自然语言判断，不写库。
    type: llm_call
    config:
      skill: request-return
      prompt_template: |
        用户申请退货退款。已查得订单信息：
        {tool_result}

        请基于以上订单信息判断：该订单是否符合退货条件（如是否已发货、是否在退换期内、
        是否支持七天无理由），并给出简短的校验结论与下一步提示。不要执行任何退款操作。
      # 阶段 5.2：引用敏感 Skill(request-return) 的节点必须显式绑定高后果字段 order_id，
      # 即便本节点仅做话术生成（不写库），也需声明依赖已定稿的 order_id，防止模型自由填空。
      read_from:
        - state: params
          required: true
        - state: tool_result
          required: true
      write_to:
        - state: tool_result
          from: result

  - id: confirm
    type: human_approval
    config:
      approval_type: refund
      thread_id_ref: thread_id
      read_from:
        - state: tool_result
          required: true

  - id: execute_return
    type: direct_tool
    config:
      skill: request-return
      # 阶段 5.2：request-return 是敏感 Skill（risk: high），其高后果字段 order_id
      # 必须由确定性来源强制绑定（此处经 read_from: state.params 从上游抽取定稿注入，
      # 业务不可省略让模型自由填空）。reason 非身份/资金类，可由上游透传或模型补充。
      read_from:
        - state: params
          required: true
        - state: tool_result
          required: true
      write_to:
        - state: tool_result
          from: result

  - id: reply
    # 轻量版 4.1：原 react 节点改为 llm_call 单步生成最终回复话术。
    # 读取上游 execute_return 的退货执行结果，生成告知用户退货单号与预计退款时间的回复。
    type: llm_call
    config:
      skill: request-return
      prompt_template: |
        退货退款流程已完成，执行结果：
        {tool_result}

        请基于以上结果，用友好、简洁的中文告知用户：退货单号、预计退款时间（1-3 个工作日原路返回），
        以及后续注意事项。不要编造未提供的信息。
      # 阶段 5.2：同样显式绑定 order_id（见 validate 节点说明）。
      read_from:
        - state: params
          required: true
        - state: tool_result
          required: true
      write_to:
        - state: tool_result
          from: result

edges:
  - from: normalize
    to: intent
  - from: intent
    to: query_order
  - from: query_order
    to: validate
  - from: validate
    to: confirm
  - from: confirm
    conditions:
      - op: on_intent==
        value: approve
        target: execute_return
      - op: on_intent==
        value: reject
        target: reply
  - from: execute_return
    to: reply

guards:
  - type: input_filter
  - type: output_filter
  - type: lock
  - type: persist
  - type: observe
